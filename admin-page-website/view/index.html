<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roman Augusto: Admin Page - View Projects</title>
    <!-- Compiled and minified CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <link href="./index.css" rel="stylesheet" />
    <style>
      .brand-logo {
        padding-left: 20px !important;
      }
      .project-card {
        transition: transform 0.3s ease;
      }
      .project-card:hover {
        transform: translateY(-5px);
      }
      .card-image img {
        height: 200px;
        object-fit: cover;
      }
      .preloader-wrapper {
        margin: 50px auto;
        display: block;
      }
      @media only screen and (max-width: 992px) {
        .brand-logo {
          padding-left: 0 !important;
        }
        nav .sidenav-trigger {
          float: right;
          margin-right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <script src="../validation.js"></script>
    <script src="../purge.js" defer></script>
    <script src="./index.js" defer></script>
    <section id="header-container">
      <nav>
        <div class="nav-wrapper teal darken-2">
          <a href="#" class="brand-logo center-on-med-and-down">Admin Page</a>
          <ul id="nav-mobile" class="right hide-on-med-and-down">
            <li><a href="/admin-page-website/update">UPDATE</a></li>
            <li><a href="/admin-page-website/delete">DELETE</a></li>
            <li><a href="#">VIEW</a></li>
            <li><a href="#" id="purge-link">PURGE USERS</a></li>
            <li><a href="#" id="logoutBtn">LOGOUT</a></li>
          </ul>
          <a href="#" data-target="mobile-nav" class="sidenav-trigger right"
            ><i class="material-icons">menu</i></a
          >
        </div>
      </nav>

      <!-- Mobile Sidenav -->
      <ul class="sidenav" id="mobile-nav">
        <li>
          <div class="user-view">
            <div class="background teal darken-2"></div>
            <span class="white-text name">Admin Panel</span>
          </div>
        </li>
        <li>
          <a href="/admin-page-website/update"
            ><i class="material-icons">add_circle</i>UPDATE</a
          >
        </li>
        <li>
          <a href="/admin-page-website/delete"
            ><i class="material-icons">delete</i>DELETE</a
          >
        </li>
        <li>
          <a href="#"><i class="material-icons">visibility</i>VIEW</a>
        </li>
        <li>
          <a href="#" id="mobile-purge-link"
            ><i class="material-icons">delete_forever</i>PURGE USERS</a
          >
        </li>
        <li>
          <a href="#" id="mobile-logout-btn"
            ><i class="material-icons">exit_to_app</i>LOGOUT</a
          >
        </li>
      </ul>
    </section>
    <section id="main" class="container">
      <h1 class="center-align">View All Projects</h1>

      <div class="row">
        <div class="col s12">
          <div class="progress" id="loading-indicator">
            <div class="indeterminate"></div>
          </div>
        </div>
      </div>

      <div class="row" id="projects-container">
        <!-- Projects will be loaded dynamically here -->
      </div>

      <div id="no-projects-message" class="center-align" style="display: none">
        <p>No projects found in the database.</p>
      </div>
    </section>

    <script>
      // Initialize mobile sidenav
      document.addEventListener("DOMContentLoaded", function () {
        var elems = document.querySelectorAll(".sidenav");
        var instances = M.Sidenav.init(elems);

        // Add event listeners for mobile menu
        document
          .getElementById("mobile-purge-link")
          .addEventListener("click", function (e) {
            var purgeEvent = new Event("click");
            document.getElementById("purge-link").dispatchEvent(purgeEvent);
          });

        document
          .getElementById("mobile-logout-btn")
          .addEventListener("click", function (e) {
            var logoutEvent = new Event("click");
            document.getElementById("logoutBtn").dispatchEvent(logoutEvent);
          });
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Augusto: Admin Page</title>
      <!-- Compiled and minified CSS -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
      <!-- Material Icons -->
      <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
      <!-- Compiled and minified JavaScript -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>           
    <link href="./index.css" type="stylesheet">
    <style>
        .brand-logo {
            padding-left: 20px !important;
        }
        @media only screen and (max-width: 992px) {
            .brand-logo {
                padding-left: 0 !important;
            }
            nav .sidenav-trigger {
                float: right;
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem("sessionKey")) {
            window.location.replace("/admin-page-website/update")
        }
    </script>
    <script src="./purge.js" defer></script>
    <script src="./index.js" defer></script>
    <section id="header-container">
        <nav>
            <div class="nav-wrapper teal darken-2">
              <a href="#" class="brand-logo center-on-med-and-down">Admin Page</a> 
              <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="/admin-page-website/update">UPDATE</a></li>
                <li><a href="/admin-page-website/delete">DELETE</a></li>
                <li><a href="/admin-page-website/view">VIEW</a></li>
                <li><a href="#" id="purge-link">PURGE USERS</a></li>
              </ul>
              <a href="#" data-target="mobile-nav" class="sidenav-trigger right"><i class="material-icons">menu</i></a>
            </div>
        </nav>

        <!-- Mobile Sidenav -->
        <ul class="sidenav" id="mobile-nav">
            <li><div class="user-view">
                <div class="background teal darken-2">
                </div>
                <span class="white-text name">Admin Panel</span>
            </div></li>
            <li><a href="/admin-page-website/update"><i class="material-icons">add_circle</i>UPDATE</a></li>
            <li><a href="/admin-page-website/delete"><i class="material-icons">delete</i>DELETE</a></li>
            <li><a href="/admin-page-website/view"><i class="material-icons">visibility</i>VIEW</a></li>
            <li><a href="#" id="mobile-purge-link"><i class="material-icons">delete_forever</i>PURGE USERS</a></li>
        </ul>
    </section>
    <section id="main" class="center-align">
        <h1>Login</h1>
        <div class="row">
            <form class="col s12" action="https://romanaugusto.up.railway.app/v1/login" method="post" id="login-form">
                <div class="row">
                    <div class="input-field col s12 m4 offset-m4">
                      <input id="username" type="text" class="validate" name="username">
                      <label for="username">Username</label>
                    </div>
                </div>  
                <div class="row">
                <div class="input-field col s12 m4 offset-m4">
                  <input id="password" type="password" class="validate" name="password">
                  <label for="password">Password</label>
                </div>
              </div>
              </div>
              <button id="submitBtn" class="waves-effect waves-light btn" type="button">Login</button>
            </form>
          </div>

    </section>

    <script>
        // Initialize mobile sidenav
        document.addEventListener('DOMContentLoaded', function() {
            var elems = document.querySelectorAll('.sidenav');
            var instances = M.Sidenav.init(elems);
            
            // Add event listener to mobile purge link
            document.getElementById('mobile-purge-link').addEventListener('click', function(e) {
                var purgeEvent = new Event('click');
                document.getElementById('purge-link').dispatchEvent(purgeEvent);
            });
        });
    </script>
</body>
</html>
